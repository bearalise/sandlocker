name: Bug report
description: Report a problem with SandLocker
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Do not report security vulnerabilities here** — see
        [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands / code / template. Minimal is best.
      render: shell
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS/kernel, `/dev/kvm` present?, Rust/Node/Python versions, SandLocker version or commit.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant output (daemon log, `console.*.log`, JSON verdicts). Redact secrets.
      render: shell
    validations:
      required: false
