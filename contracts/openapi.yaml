# SandLocker 控制面 REST 契约（v1alpha，M1 W8）。
#
# D3 护栏「契约先行」：本文件是权威描述，`crates/sl-node/src/api.rs` 实现与之逐一对齐，
# W9 Python SDK 据此生成。M1 单机版仅实现下列端点子集；pause/resume/fork、鉴权、配额、
# 端口签名 URL、gRPC 服务端属 M2+（见各端点注与 `sandlocker.proto`）。
#
# 传输：手写极简 HTTP/1.1（仅 Content-Length + Connection: close，不支持 chunked/keep-alive）。
# 默认监听 127.0.0.1:7878（本地环回，无 TLS/鉴权；M3 加 mTLS + 令牌）。
openapi: 3.0.3
info:
  title: SandLocker Control-Plane API
  version: 1.0.0-alpha
  description: >
    SandLocker 微 VM 沙箱控制面。M1 单机一体化（`sandlocker up` = `sl-node --serve`）。
servers:
  - url: http://127.0.0.1:7878
    description: 本地守护（sandlocker up）

paths:
  /v1/sandboxes:
    post:
      summary: 创建沙箱（走快照恢复，~130ms）
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxRequest'
      responses:
        '201':
          description: 已创建并运行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    get:
      summary: 列出沙箱
      operationId: listSandboxes
      responses:
        '200':
          description: 沙箱元数据数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SandboxMeta'
        '500':
          $ref: '#/components/responses/Error'

  /v1/sandboxes/{id}:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    get:
      summary: 取单个沙箱元数据
      operationId: getSandbox
      responses:
        '200':
          description: 沙箱元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxMeta'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: 销毁沙箱（杀进程 + 清目录 + 删 store 键）
      operationId: deleteSandbox
      responses:
        '204':
          description: 已销毁
        '404':
          $ref: '#/components/responses/Error'

  /v1/sandboxes/{id}/keepalive:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      summary: 续期（在线滑 idle lease 窗，避免空闲回收）
      description: >
        M2 W2（M2-Q9）：只滑动空闲回收窗，不延长 TTL 绝对硬顶——过硬顶 keepalive 救不了。
        返回续期后的 idle lease 到期与不变的 TTL 硬顶到期（unix 秒）。
      operationId: keepAliveSandbox
      responses:
        '200':
          description: 已续期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeepAliveResult'
        '404':
          $ref: '#/components/responses/Error'

  /v1/sandboxes/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      summary: 暂停（FR-1.4）——落快照 + 停 VM（需后端 pause_resume）
      description: >
        M2 W9（M2-Q5）：暂停沙箱，落 Full 快照并停止 VM。paused 期间不可 exec/文件。后端不具
        pause_resume 能力时返 409 UNSUPPORTED_BY_BACKEND（如 gVisor）。
      operationId: pauseSandbox
      responses:
        '200':
          description: 已暂停（state=paused）
          content: { application/json: { schema: { $ref: '#/components/schemas/Sandbox' } } }
        '409':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /v1/sandboxes/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      summary: 恢复（FR-1.4）——从快照拉起（需后端 pause_resume）
      description: >
        M2 W9：从 paused 快照恢复运行。ADR-12 reinit 换发新 machine-id/RNG/会话密钥（克隆熵不泄漏）。
      operationId: resumeSandbox
      responses:
        '200':
          description: 已恢复（state=running，返回新 machine_id）
          content: { application/json: { schema: { $ref: '#/components/schemas/Sandbox' } } }
        '409':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /v1/sandboxes/{id}/fork:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      summary: fork（M2-Q5）——从（已 pause 的）父快照派生新实例（需后端 snapshot_fork）
      description: >
        M2 W9：从父沙箱的 paused 快照派生新实例，经 reinit 得**独立身份**（machine-id/RNG/会话密钥
        必异，克隆熵不泄漏），复用父 rootfs/快照——**不刷新安全边界**。父须先 pause。
      operationId: forkSandbox
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl: { type: integer, default: 300 }
                idle: { type: integer }
      responses:
        '201':
          description: 新实例（含 forked_from）
          content: { application/json: { schema: { $ref: '#/components/schemas/Sandbox' } } }
        '409':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'

  /v1/sandboxes/{id}/ticket:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      summary: 签发数据面网关一次性 HMAC 签名 URL（ADR-22 / M2-Q6）
      description: >
        M2 W10：控制面据进程内 secret 签发 ticket（`{action}` ∈ exec|file|logs|port，port 用于端口暴露）。
        返回签名 URL（默认指向网关 127.0.0.1:7879 的 `/gw/*`）。网关**无状态验签**（HMAC 自包含）+ 未过期 +
        **一次性**（nonce 消费一次即失效）。数据面（exec/文件/日志/端口反代）走网关直连，控制面不持连接态。
      operationId: mintTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [exec, file, logs, port] }
                port: { type: integer, description: action=port 时暴露的 guest 端口 }
                ttl: { type: integer, default: 300, description: ticket 有效期（秒） }
      responses:
        '200':
          description: 签名 URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        '400':
          $ref: '#/components/responses/Error'

  /v1/sandboxes/{id}/expose:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      summary: 暴露 VM 内端口为稳定地址（L4 透传持久反代，FR-3.3）
      description: >
        起一条持久 L4（TCP）透传监听器：外部每条连接直接与 guest `127.0.0.1:{port}` 建裸字节隧道，
        对上层协议不可见——支持任意 HTTP 方法、流式/SSE、WebSocket、keep-alive。返回稳定地址
        `http://{bind}:{host_port}/`（可分享、任意 path）。仅 FC（vsock）后端。**纯 L4 透传无每请求鉴权**，
        默认 bind 127.0.0.1；非回环 bind 需守护带 `--expose-allow-public`（仅可信网络）。同 guest_port 幂等。
      operationId: exposePort
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              properties:
                port: { type: integer, description: 要暴露的 guest 端口 }
                host_port: { type: integer, description: host 监听端口（缺省 0=OS 分配） }
                bind: { type: string, default: "127.0.0.1", description: host 监听地址（非回环需 --expose-allow-public） }
      responses:
        '201':
          description: 已暴露
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  bind: { type: string }
                  host_port: { type: integer }
                  guest_port: { type: integer }
        '400':
          $ref: '#/components/responses/Error'
    get:
      summary: 列出该沙箱已暴露端口
      operationId: listExposes
      responses:
        '200':
          description: 暴露列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    url: { type: string }
                    bind: { type: string }
                    host_port: { type: integer }
                    guest_port: { type: integer }

  /v1/sandboxes/{id}/expose/{guest_port}:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
      - name: guest_port
        in: path
        required: true
        schema: { type: integer }
    delete:
      summary: 撤销端口暴露（停止监听器）
      operationId: unexposePort
      responses:
        '204':
          description: 已撤销
        '404':
          $ref: '#/components/responses/Error'

  # 数据面网关（默认 http://127.0.0.1:7879，与控制面分离，M3 可拆独立副本）：
  #   POST /gw/exec?<ticket>   body{cmd}           — 经 ticket 直连 exec
  #   PUT|GET /gw/file?<ticket>&p=<path>           — 文件读写
  #   GET /gw/logs?<ticket>                        — 日志
  #   GET /gw/p?<ticket>&p=<guest_path>            — 端口反代（HTTP over vsock，FR-3.3 外部访问 VM 内部）
  # ticket 参数（query）：sid,action,port,exp,nonce,sig。均为一次性 + HMAC 验签。

  /v1/sandboxes/{id}/exec:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      summary: 在沙箱内执行命令（缓冲式，返 exit/stdout/stderr）
      description: >
        缓冲式：命令跑完才返回聚合输出。逐块流式 stdout/stderr 见
        `POST /v1/sandboxes/{id}/exec/stream`；PTY 属独立交互通道。
      operationId: execInSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
      responses:
        '200':
          description: 执行结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResult'
        '500':
          $ref: '#/components/responses/Error'

  /v1/sandboxes/{id}/exec/stream:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    post:
      summary: 在沙箱内流式执行命令（NDJSON，边跑边推 stdout/stderr）
      description: >
        流式对偶：守护劫持本连接，以 NDJSON（每行一个 JSON 事件、Connection: close、
        无 Content-Length）边跑边推输出，stdout/stderr **分离**、逐块。每行事件为二选一：
        输出块 `{"stream":"stdout"|"stderr","data":"<base64>"}`（data 为该块原始字节的
        base64，二进制安全），或终帧 `{"exit_code":<int>}`（命令结束，退出码语义同 exec：
        信号终止为 128+signo）。仅 FC/vsock 后端；非 vsock 后端返回 400。
      operationId: execStreamInSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
      responses:
        '200':
          description: NDJSON 事件流（application/x-ndjson，见 description）
          content:
            application/x-ndjson:
              schema:
                type: string
                description: 每行一个 JSON 对象——输出块 {stream,data} 或终帧 {exit_code}。
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /v1/sandboxes/{id}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
      - name: path
        in: path
        required: true
        description: 沙箱内绝对路径（前导 / 可省；支持多段 a/b/c）
        schema:
          type: string
    put:
      summary: 写文件（body 原始字节 → guest base64 解码落盘）
      description: M1 经 exec+base64 桥接，需 guest 有 base64 applet。原生大文件 fs 属 M2。
      operationId: putFile
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: 已写入
        '500':
          $ref: '#/components/responses/Error'
    get:
      summary: 读文件（guest base64 → 解码为原始字节）
      operationId: getFile
      responses:
        '200':
          description: 文件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '500':
          $ref: '#/components/responses/Error'

  /v1/sandboxes/{id}/logs:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    get:
      summary: 取沙箱引导/串口日志（console.load.log）
      operationId: getLogs
      responses:
        '200':
          description: 日志文本
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'

  /v1/templates:
    get:
      summary: 列已注册模板（M1：模板=预烘焙快照）
      operationId: listTemplates
      responses:
        '200':
          description: 模板数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
        '500':
          $ref: '#/components/responses/Error'

  /v1/templates:build:
    post:
      summary: 构建模板（M1 未实现，返 501）
      description: >
        M1 单机版用 CLI `sandlocker build <file.toml>`（= `sl-node --build`）单发构建；
        经守护的异步构建属 M2。本端点当前恒返 501。
      operationId: buildTemplate
      responses:
        '501':
          $ref: '#/components/responses/Error'

  /v1/backends:
    get:
      summary: 后端列表与能力集（ADR-14，M2 W6）
      description: >
        Sandbox ABI 后端及其注册能力位集（pause_resume / snapshot_fork / prebake_snapshot /
        gpu_passthrough / persistent_volume）。create 的 required_capabilities 据此在**创建期**校验，
        不满足即 UNSUPPORTED_BY_BACKEND（禁止运行期静默降级）。M2 W6 单后端 fc；W7 增 gVisor。
      operationId: listBackends
      responses:
        '200':
          description: 后端数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Backend'
  /v1/audit:
    get:
      summary: 审计日志（M3 W7，FR-7.3）
      description: >
        append-only 审计条目（变更操作 + 状态码）。鉴权模式（--require-auth）下按调用者项目过滤；
        每条形如 {ts, actor, action, target, code}。
      operationId: listAudit
      responses:
        '200':
          description: 审计条目数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

components:
  parameters:
    SandboxId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CreateSandboxRequest:
      type: object
      required: [template]
      properties:
        template:
          type: string
          description: 已注册模板名（经 template/<name>/latest 解析到目录）
        cpu:
          type: integer
          default: 2
        mem:
          type: integer
          description: 内存 MiB
          default: 512
        ttl:
          type: integer
          description: 绝对存活硬顶（秒）
          default: 300
        idle:
          type: integer
          description: 空闲回收窗口（秒，缺省 = ttl）
        env:
          type: object
          additionalProperties:
            type: string
          description: 注入为沙箱 labels/元数据
        required_capabilities:
          type: array
          items:
            type: string
            enum: [pause_resume, snapshot_fork, prebake_snapshot, gpu_passthrough, persistent_volume, network_egress]
          description: >
            要求后端具备的能力集（ADR-14）。后端不满足即创建期返回 UNSUPPORTED_BY_BACKEND；
            未知能力名恒不被满足。缺省空（不约束）。
        backend:
          type: string
          enum: [fc, gvisor]
          description: >
            显式选后端（ADR-14，M2 W7）。缺省 fc。无此后端（如 gVisor 未注册）即 UNSUPPORTED_BY_BACKEND。
        network:
          type: string
          enum: [none, egress]
          default: none
          description: >
            运行时网络（FR-3.3）。none（默认）= 无网卡（快照恢复，秒级，出口为零）；egress = 冷启动进
            per-instance netns 带 NIC + NAT，可出站（npm/pip install，开放出口无过滤）。egress 仅 FC
            后端且守护 root 运行（隐含 network_egress 能力），否则 create 期 UNSUPPORTED_BY_BACKEND；
            egress 沙箱走冷启动（比恢复慢）、不进池。
    Sandbox:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum: [running, paused]
          example: running
        machine_id:
          type: string
        template:
          type: string
        forked_from:
          type: string
          description: M2 W9：fork 得来时为父沙箱 id（直接 create 则无）
        pool_hit:
          type: boolean
        hot_hit:
          type: boolean
        total_ms:
          type: integer
        copy_ms:
          type: integer
        api_ready_ms:
          type: integer
        load_ms:
          type: integer
        resume_ms:
          type: integer
    SandboxMeta:
      type: object
      properties:
        id:
          type: string
        vcpus:
          type: integer
        mem_mib:
          type: integer
        ttl_secs:
          type: integer
        idle_secs:
          type: integer
        created_at:
          type: integer
        ttl_deadline:
          type: integer
        template:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    ExecRequest:
      type: object
      required: [cmd]
      properties:
        cmd:
          type: string
          description: 传给 guest sh -c 的命令行
    ExecResult:
      type: object
      properties:
        exit_code:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
    KeepAliveResult:
      type: object
      properties:
        id:
          type: string
        lease_deadline:
          type: integer
          description: 续期后的空闲回收窗到期（unix 秒）
        ttl_deadline:
          type: integer
          description: TTL 绝对硬顶到期（unix 秒，keepalive 不改动；可为 null）
          nullable: true
    Template:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
          description: 内容寻址版本（构建输入哈希派生）
    Backend:
      type: object
      properties:
        id:
          type: string
          description: 后端标识（fc / gvisor）
        capabilities:
          type: array
          items:
            type: string
          description: 注册能力集（snake_case，ADR-14）
    Error:
      type: object
      properties:
        error:
          type: string
